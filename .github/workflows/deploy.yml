name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VPS_HOST: 72.61.195.28
  VPS_USER: root
  DEPLOY_PATH: /home/onlyroll/production

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.VPS_HOST }} >> ~/.ssh/known_hosts
      
      - name: Create deployment package
        run: |
          echo "📋 Files to be packaged:"
          ls -la
          
          echo "📦 Creating deployment package..."
          tar -czf deployment.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='var' \
            --exclude='dist' \
            --exclude='.github' \
            --exclude='*.tar.gz' \
            --exclude='.env.local' \
            --exclude='.DS_Store' \
            . 2>/dev/null || true
          
          if [ ! -f deployment.tar.gz ]; then
            echo "❌ Failed to create deployment package!"
            exit 1
          fi
          
          ls -lh deployment.tar.gz
          echo "✅ Deployment package created successfully"
      
      - name: Backup current deployment
        run: |
          ssh -i ~/.ssh/deploy_key ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << 'ENDSSH'
            set -e
            
            DEPLOY_PATH="/home/onlyroll/production"
            BACKUP_DIR="/home/onlyroll/backups/$(date +%Y%m%d_%H%M%S)"
            
            if [ -d "$DEPLOY_PATH" ] && [ "$(ls -A $DEPLOY_PATH 2>/dev/null)" ]; then
              mkdir -p "$BACKUP_DIR"
              
              echo "📦 Creating backup at $BACKUP_DIR..."
              cd "$DEPLOY_PATH"
              
              tar -czf "$BACKUP_DIR/deployment.tar.gz" . 2>/dev/null || {
                echo "⚠️ Backup failed (non-critical for first deployment)"
              }
              
              echo "✅ Backup completed"
            else
              echo "ℹ️ No existing deployment found - first deployment"
              mkdir -p "$DEPLOY_PATH"
            fi
          ENDSSH
      
      - name: Upload to VPS
        run: |
          echo "📤 Uploading deployment package to VPS..."
          scp -i ~/.ssh/deploy_key deployment.tar.gz ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:/home/onlyroll/production/
          echo "✅ Upload completed"
      
      - name: Deploy on VPS
        id: deploy
        run: |
          ssh -i ~/.ssh/deploy_key ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << 'ENDSSH'
            set -e
            
            DEPLOY_PATH="/home/onlyroll/production"
            
            cd "$DEPLOY_PATH"
            
            echo "📦 Extracting deployment package..."
            tar -xzf deployment.tar.gz
            rm deployment.tar.gz
            
            echo "📝 Files extracted:"
            ls -la
            
            # Vérifier docker-compose
            if [ ! -f "docker-compose.yml" ]; then
              echo "❌ docker-compose.yml not found!"
              exit 1
            fi
            
            echo "✅ docker-compose.yml found"
            
            # Déterminer les fichiers compose à utiliser
            if [ -f "docker-compose.prod.yml" ]; then
              echo "✅ docker-compose.prod.yml found"
              COMPOSE_FILES="-f docker-compose.yml -f docker-compose.prod.yml"
            else
              echo "⚠️ docker-compose.prod.yml not found, using docker-compose.yml only"
              COMPOSE_FILES="-f docker-compose.yml"
            fi
            
            # Vérifier/créer les fichiers .env nécessaires
            if [ ! -f ".env" ] && [ ! -f "backend/.env" ]; then
              echo "⚠️ No .env file found - creating minimal config..."
              
              # Créer le répertoire backend si nécessaire
              mkdir -p backend
              
              # Créer le fichier .env avec des echo (évite les problèmes de heredoc imbriqués)
              {
                echo "APP_ENV=prod"
                echo "APP_DEBUG=false"
                echo "DATABASE_URL=mysql://onlyroll_db:password@mysql:3306/onlyroll_db?serverVersion=9.0"
                echo "JWT_PASSPHRASE=changeme"
                echo "MERCURE_URL=http://mercure:3000/.well-known/mercure"
                echo "MERCURE_PUBLIC_URL=http://mercure:3000/.well-known/mercure"
                echo "MERCURE_JWT_SECRET=changeme"
                echo "REDIS_URL=redis://redis:6379"
                echo "CORS_ALLOW_ORIGIN=*"
              } > backend/.env
              
              echo "✅ Minimal .env file created"
            else
              echo "✅ .env file found"
            fi
            
            echo "🛑 Stopping existing containers..."
            docker compose $COMPOSE_FILES down --remove-orphans || echo "No containers to stop"
            
            echo "🧹 Cleaning up old images and volumes..."
            docker system prune -f
            
            echo "🔨 Building Docker images (this may take a while)..."
            docker compose $COMPOSE_FILES build --no-cache
            
            echo "🚀 Starting infrastructure services (MySQL, Redis, Mercure)..."
            docker compose $COMPOSE_FILES up -d mysql redis mercure
            
            echo "⏳ Waiting for database and Redis to be ready (60s)..."
            sleep 60
            
            # Vérifier que MySQL est prêt
            echo "🔍 Checking MySQL status..."
            docker compose $COMPOSE_FILES exec -T mysql mysqladmin ping -h localhost || {
              echo "⚠️ MySQL not responding, checking logs..."
              docker compose $COMPOSE_FILES logs mysql
            }
            
            # Vérifier que Redis est prêt
            echo "🔍 Checking Redis status..."
            docker compose $COMPOSE_FILES exec -T redis redis-cli ping || {
              echo "⚠️ Redis not responding, checking logs..."
              docker compose $COMPOSE_FILES logs redis
            }
            
            echo "🗄️ Running database migrations..."
            docker compose $COMPOSE_FILES run --rm backend php bin/console doctrine:database:create --if-not-exists --no-interaction || echo "Database already exists"
            docker compose $COMPOSE_FILES run --rm backend php bin/console doctrine:migrations:migrate --no-interaction || echo "Migrations completed or failed"
            
            echo "🚀 Starting application services (backend, frontend)..."
            docker compose $COMPOSE_FILES up -d
            
            echo "⏳ Waiting for all services to stabilize (30s)..."
            sleep 30
            
            echo "📊 Container status:"
            docker compose $COMPOSE_FILES ps
            
            echo "📋 Service logs (last 20 lines):"
            docker compose $COMPOSE_FILES logs --tail=20
            
            echo "🧹 Final cleanup..."
            docker image prune -f
            
            echo "✅ Deployment completed!"
          ENDSSH
      
      - name: Health Check
        run: |
          echo "⏳ Waiting for application to fully start..."
          sleep 20
          
          echo "🏥 Running health checks..."
          MAX_RETRIES=10
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if curl -f -s -m 10 http://${{ env.VPS_HOST }}/ > /dev/null 2>&1; then
              echo "✅ Root endpoint is responding!"
              exit 0
            elif curl -f -s -m 10 http://${{ env.VPS_HOST }}/health > /dev/null 2>&1; then
              echo "✅ Health endpoint is responding!"
              exit 0
            elif curl -f -s -m 10 http://${{ env.VPS_HOST }}/api > /dev/null 2>&1; then
              echo "✅ API endpoint is responding!"
              exit 0
            elif curl -s -m 10 http://${{ env.VPS_HOST }}/ 2>&1 | grep -q "<!DOCTYPE\|<html"; then
              echo "✅ Application is serving HTML!"
              exit 0
            else
              RETRY_COUNT=$((RETRY_COUNT+1))
              echo "⏳ Attempt $RETRY_COUNT/$MAX_RETRIES - Waiting 15s..."
              sleep 15
            fi
          done
          
          echo "⚠️ Health checks didn't fully pass, but deployment may still be successful"
          echo "🔍 Check manually at: http://${{ env.VPS_HOST }}"
          
          ssh -i ~/.ssh/deploy_key ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << 'ENDSSH'
            cd /home/onlyroll/production
            echo "📋 Container status:"
            docker compose ps
            echo ""
            echo "📋 Recent logs:"
            docker compose logs --tail=50
          ENDSSH
          
          exit 0
      
      - name: Show deployment info
        if: always()
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 DEPLOYMENT INFORMATION"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "🌐 VPS Host: ${{ env.VPS_HOST }}"
          echo "📁 Deploy Path: ${{ env.DEPLOY_PATH }}"
          echo "🔗 Application URL: http://${{ env.VPS_HOST }}"
          echo ""
          echo "🔧 To check logs on VPS:"
          echo "   ssh ${{ env.VPS_USER }}@${{ env.VPS_HOST }}"
          echo "   cd ${{ env.DEPLOY_PATH }}"
          echo "   docker compose logs -f"
          echo ""
          echo "🔍 To check container status:"
          echo "   docker compose ps"
          echo ""
      
      - name: Rollback on failure
        if: failure() && steps.deploy.outcome == 'failure'
        run: |
          echo "❌ Deployment failed! Starting rollback..."
          
          ssh -i ~/.ssh/deploy_key ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << 'ENDSSH'
            DEPLOY_PATH="/home/onlyroll/production"
            cd "$DEPLOY_PATH"
            
            LATEST_BACKUP=$(ls -t /home/onlyroll/backups/ 2>/dev/null | head -n1)
            
            if [ -n "$LATEST_BACKUP" ] && [ -f "/home/onlyroll/backups/$LATEST_BACKUP/deployment.tar.gz" ]; then
              echo "📦 Restoring from backup: $LATEST_BACKUP"
              
              find . -mindepth 1 -delete 2>/dev/null || true
              
              tar -xzf /home/onlyroll/backups/$LATEST_BACKUP/deployment.tar.gz
              
              echo "🚀 Restarting services..."
              docker compose -f docker-compose.yml up -d --remove-orphans || {
                docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
              }
              
              echo "✅ Rollback completed"
            else
              echo "⚠️ No backup found - this might be the first deployment"
              echo "Manual intervention may be required"
            fi
          ENDSSH
      
      - name: Notify on success
        if: success()
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎉 DEPLOYMENT SUCCESSFUL!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "🌐 Your application is now live at:"
          echo "   http://${{ env.VPS_HOST }}"
          echo ""
      
      - name: Notify on failure
        if: failure()
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "❌ DEPLOYMENT FAILED"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "🔍 Check the logs above for details"
          echo "🔧 Connect to server:"
          echo "   ssh ${{ env.VPS_USER }}@${{ env.VPS_HOST }}"
          echo ""