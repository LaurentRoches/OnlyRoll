name: Deploy to Production

on:
  # Deploy after CI passes on main
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    branches: [main]
    types: [completed]
  # Tag-based deploys (wiki imports, releases)
  push:
    tags: ['v*.*.*', '*-importWiki']
  workflow_dispatch:

env:
  VPS_HOST: 72.61.195.28
  VPS_USER: root
  DEPLOY_PATH: /home/onlyroll/production

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.VPS_HOST }} >> ~/.ssh/known_hosts
      
      - name: Create deployment package
        run: |
          echo "Files to be packaged:"
          ls -la
          
          echo "Creating deployment package..."
          tar -czf deployment.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='var' \
            --exclude='dist' \
            --exclude='.github' \
            --exclude='*.tar.gz' \
            --exclude='.env.local' \
            --exclude='.DS_Store' \
            . 2>/dev/null || true
          
          if [ ! -f deployment.tar.gz ]; then
            echo "Failed to create deployment package!"
            exit 1
          fi
          
          ls -lh deployment.tar.gz
          echo "Deployment package created successfully"
      
      - name: Backup current deployment
        run: |
          ssh -i ~/.ssh/deploy_key ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << 'ENDSSH'
            set -e
            
            DEPLOY_PATH="/home/onlyroll/production"
            BACKUP_DIR="/home/onlyroll/backups/$(date +%Y%m%d_%H%M%S)"
            
            if [ -d "$DEPLOY_PATH" ] && [ "$(ls -A $DEPLOY_PATH 2>/dev/null)" ]; then
              mkdir -p "$BACKUP_DIR"
              
              echo "Creating backup at $BACKUP_DIR..."
              cd "$DEPLOY_PATH"
              
              tar -czf "$BACKUP_DIR/deployment.tar.gz" . 2>/dev/null || {
                echo "Backup failed (non-critical for first deployment)"
              }
              
              echo "Backup completed"
            else
              echo "No existing deployment found - first deployment"
              mkdir -p "$DEPLOY_PATH"
            fi
          ENDSSH
      
      - name: Upload to VPS
        run: |
          echo "Uploading deployment package to VPS..."
          scp -i ~/.ssh/deploy_key deployment.tar.gz ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:/home/onlyroll/production/
          echo "Upload completed"
      
      - name: Extract and create .env file on VPS
        run: |
          ssh -i ~/.ssh/deploy_key ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << 'ENDSSH'
            set -e
            
            DEPLOY_PATH="/home/onlyroll/production"
            
            cd "$DEPLOY_PATH"
            
            echo "Extracting deployment package..."
            tar -xzf deployment.tar.gz
            rm deployment.tar.gz
            
            echo "Creating .env files..."
            
            # Créer le .env principal
            cat > .env << 'ENVEOF'
          APP_ENV=prod
          APP_DEBUG=0
          APP_SECRET=${{ secrets.APP_SECRET }}
          DEFAULT_URI=https://onlyroll.cloud

          # Database
          MYSQL_ROOT_PASSWORD=${{ secrets.DB_PASSWORD }}
          MYSQL_DATABASE=${{ secrets.DB_NAME }}
          MYSQL_USER=${{ secrets.DB_USER }}
          MYSQL_PASSWORD=${{ secrets.DB_PASSWORD }}
          DATABASE_URL=mysql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@mysql:3306/${{ secrets.DB_NAME }}?serverVersion=8.0

          # Redis
          REDIS_URL=redis://redis:6379

          # JWT
          JWT_SECRET_KEY=%kernel.project_dir%/config/jwt/private.pem
          JWT_PUBLIC_KEY=%kernel.project_dir%/config/jwt/public.pem
          JWT_PASSPHRASE=${{ secrets.JWT_PASSPHRASE }}

          # Mercure
          MERCURE_URL=http://mercure:3000/.well-known/mercure
          MERCURE_PUBLIC_URL=https://onlyroll.cloud/.well-known/mercure
          MERCURE_JWT_SECRET=${{ secrets.MERCURE_JWT_SECRET }}

          # CORS
          CORS_ALLOW_ORIGIN=https://onlyroll.cloud

          # Frontend
          VITE_API_URL=https://onlyroll.cloud/api
          VITE_WS_URL=wss://onlyroll.cloud:3000
          VITE_MERCURE_URL=https://onlyroll.cloud/.well-known/mercure
          ENVEOF
            
            # Créer le .env pour le backend (copié dans l'image Docker)
            cat > backend/.env << 'BACKENDENVEOF'
          APP_ENV=prod
          APP_DEBUG=0
          APP_SECRET=${{ secrets.APP_SECRET }}
          DEFAULT_URI=https://onlyroll.cloud
          DATABASE_URL=mysql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@mysql:3306/${{ secrets.DB_NAME }}?serverVersion=8.0
          REDIS_URL=redis://redis:6379
          JWT_SECRET_KEY=%kernel.project_dir%/config/jwt/private.pem
          JWT_PUBLIC_KEY=%kernel.project_dir%/config/jwt/public.pem
          JWT_PASSPHRASE=${{ secrets.JWT_PASSPHRASE }}
          MERCURE_URL=http://mercure:3000/.well-known/mercure
          MERCURE_PUBLIC_URL=https://onlyroll.cloud/.well-known/mercure
          MERCURE_JWT_SECRET=${{ secrets.MERCURE_JWT_SECRET }}
          CORS_ALLOW_ORIGIN=https://onlyroll.cloud
          APP_HOSTNAME=${{ secrets.APP_HOSTNAME }}
          APP_FRONTEND_URL=${{ secrets.APP_FRONTEND_URL }}
          APP_ADMIN_EMAIL=${{ secrets.APP_ADMIN_EMAIL }}
          MAILER_DSN=${{ secrets.MAILER_DSN }}
          MAILER_FROM=${{ secrets.MAILER_FROM }}
          BACKENDENVEOF
            
            echo ".env files created"

            echo "Generating .htpasswd for phpMyAdmin..."
            mkdir -p docker/nginx
            echo "${{ secrets.PMA_USER }}:$(openssl passwd -apr1 '${{ secrets.PMA_PASSWORD }}')" \
              > docker/nginx/.htpasswd
            echo ".htpasswd generated"
          ENDSSH
      
      - name: Save rollback state before deploy
        run: |
          ssh -i ~/.ssh/deploy_key ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << 'ENDSSH'
            set -e
            ROLLBACK_STATE_FILE="/home/onlyroll/.rollback-state"
            COMPOSE_FILE="/home/onlyroll/production/docker-compose.prod.yml"
            ROLLBACK_TAG="rollback-${{ github.sha }}"

            echo "Saving rollback state (tag: ${ROLLBACK_TAG})..."

            # Sauvegarder la version de migration courante (vide si premier déploiement)
            CURRENT_MIGRATION=""
            if [ -f "$COMPOSE_FILE" ]; then
              CURRENT_MIGRATION=$(
                docker compose -f "$COMPOSE_FILE" exec -T php-fpm \
                  php bin/console doctrine:migrations:current --no-interaction 2>/dev/null || echo ""
              )
            fi

            # Tagger les images actuelles pour permettre le rollback sans rebuild
            if docker image inspect production-php-fpm:latest > /dev/null 2>&1; then
              docker tag production-php-fpm:latest "production-php-fpm:${ROLLBACK_TAG}"
              echo "Tagged production-php-fpm:latest as production-php-fpm:${ROLLBACK_TAG}"
            else
              echo "No existing production-php-fpm:latest image (first deploy)"
            fi

            if docker image inspect production-frontend:latest > /dev/null 2>&1; then
              docker tag production-frontend:latest "production-frontend:${ROLLBACK_TAG}"
              echo "Tagged production-frontend:latest as production-frontend:${ROLLBACK_TAG}"
            else
              echo "No existing production-frontend:latest image (first deploy)"
            fi

            # Écrire le fichier d'état de rollback
            cat > "$ROLLBACK_STATE_FILE" << EOF
          ROLLBACK_TAG=${ROLLBACK_TAG}
          ROLLBACK_MIGRATION_VERSION=${CURRENT_MIGRATION}
          ROLLBACK_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

            echo "Rollback state saved:"
            cat "$ROLLBACK_STATE_FILE"
          ENDSSH

      - name: Determine import flag
        id: import_flag
        run: |
          if [[ "${{ github.ref }}" == *-importWiki ]]; then
            echo "run_imports=true" >> $GITHUB_OUTPUT
          else
            echo "run_imports=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy on VPS
        id: deploy
        run: |
          ssh -i ~/.ssh/deploy_key ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << 'ENDSSH'
            set -e

            DEPLOY_PATH="/home/onlyroll/production"
            RUN_IMPORTS="${{ steps.import_flag.outputs.run_imports }}"
            
            cd "$DEPLOY_PATH"
            
            echo "Files in directory:"
            ls -la
            
            # Vérifier docker-compose.prod.yml
            if [ ! -f "docker-compose.prod.yml" ]; then
              echo "docker-compose.prod.yml not found!"
              exit 1
            fi
            
            echo "docker-compose.prod.yml found"
            
            # Vérifier que le .env backend existe
            if [ ! -f "backend/.env" ]; then
              echo "backend/.env not found!"
              exit 1
            fi
            
            echo "backend/.env found"
            
            COMPOSE_FILE="docker-compose.prod.yml"
            
            echo "Stopping existing containers..."
            docker compose -f $COMPOSE_FILE down --remove-orphans 2>/dev/null || echo "No compose containers to stop"
            
            # Forcer l'arrêt des conteneurs par nom (au cas où)
            echo "Removing any existing OnlyRoll containers..."
            docker rm -f onlyroll-php-prod onlyroll-nginx-prod onlyroll-frontend-prod \
                        onlyroll-mysql-prod onlyroll-redis-prod onlyroll-mercure-prod \
                        onlyroll-phpmyadmin-prod 2>/dev/null || echo "No individual containers to remove"
            
            # Supprimer le réseau s'il existe
            echo "Removing old network..."
            docker network rm onlyroll-network-prod 2>/dev/null || echo "No network to remove"
            
            # Si variable RESET_MYSQL_DATA est définie, supprimer le volume MySQL
            # ATTENTION: Cela supprime toutes les données de la BDD !
            # Pour activer: Ajouter RESET_MYSQL_DATA=true dans les secrets GitHub
            if [ "${RESET_MYSQL_DATA:-false}" = "true" ]; then
              echo " RESET_MYSQL_DATA enabled - Removing MySQL volume..."
              docker volume rm production_mysql-data 2>/dev/null || echo "No MySQL volume to remove"
            fi
            
            echo "Cleaning up old images..."
            docker system prune -f
            
            echo "Building Docker images with --no-cache (this may take a while)..."
            docker compose -f $COMPOSE_FILE build --no-cache php-fpm frontend

            # Initialize SSL certificates - Always ensure they exist
            echo "Initializing SSL certificates..."

            # Create certbot volumes first
            docker volume create production_certbot-certs 2>/dev/null || true
            docker volume create production_certbot-webroot 2>/dev/null || true
            docker volume create production_certbot-var 2>/dev/null || true

            # Check if certificates exist using docker run
            CERT_EXISTS=$(docker run --rm -v production_certbot-certs:/etc/letsencrypt alpine sh -c \
              "test -f /etc/letsencrypt/live/onlyroll.cloud/privkey.pem && echo 'yes' || echo 'no'")

            if [ "$CERT_EXISTS" = "no" ]; then
              echo "SSL certificates not found. Creating dummy certificates for initial nginx start..."

              docker run --rm -v production_certbot-certs:/etc/letsencrypt alpine sh -c "
                mkdir -p /etc/letsencrypt/live/onlyroll.cloud && \
                cd /etc/letsencrypt/live/onlyroll.cloud && \
                openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
                  -keyout privkey.pem \
                  -out fullchain.pem \
                  -subj '/CN=onlyroll.cloud' 2>/dev/null
              " && echo "Dummy certificates created" || {
                echo "Failed to create dummy certificates"
                exit 1
              }
            else
              echo "SSL certificates already exist"
            fi

            echo "Starting all services..."
            docker compose -f $COMPOSE_FILE up -d
            
            echo "Waiting for services to be ready (30s)..."
            sleep 30
            
            echo "Checking MySQL status..."
            for i in {1..10}; do
              if docker compose -f $COMPOSE_FILE exec -T mysql mysqladmin ping -h localhost --silent; then
                echo "MySQL is ready"
                break
              fi
              if [ $i -eq 10 ]; then
                echo "MySQL not responding after 10 attempts"
                docker compose -f $COMPOSE_FILE logs mysql
              fi
              sleep 3
            done
            
            echo "Checking Redis status..."
            if docker compose -f $COMPOSE_FILE exec -T redis redis-cli ping | grep -q PONG; then
              echo "Redis is ready"
            else
              echo "Redis not responding"
              docker compose -f $COMPOSE_FILE logs redis
            fi
            
            # Obtain real SSL certificate if needed
            echo "Checking if real SSL certificate is needed..."

            # Check if certificate is valid for more than 30 days (dummy certs are only valid for 1 day)
            CERT_IS_DUMMY=$(docker run --rm -v production_certbot-certs:/etc/letsencrypt alpine sh -c \
              "openssl x509 -in /etc/letsencrypt/live/onlyroll.cloud/fullchain.pem -noout -checkend 2592000 2>/dev/null && echo 'no' || echo 'yes'")

            if [ "$CERT_IS_DUMMY" = "yes" ]; then
              echo "Certificate needs renewal or is dummy. Obtaining certificate from Let's Encrypt..."

              # Wait a bit for nginx to be fully ready
              sleep 5

              docker compose -f $COMPOSE_FILE run --rm certbot certonly \
                --webroot \
                --webroot-path=/var/www/certbot \
                --email support@onlyroll.cloud \
                --agree-tos \
                --no-eff-email \
                --force-renewal \
                -d onlyroll.cloud \
                -d www.onlyroll.cloud && {
                  echo "Real SSL certificate obtained!"
                  echo "Reloading Nginx..."
                  docker compose -f $COMPOSE_FILE exec -T nginx nginx -s reload || docker compose -f $COMPOSE_FILE restart nginx
                  sleep 5
                } || {
                  echo "Failed to obtain real certificate. Using dummy certificate for now."
                  echo "The site will work but with a self-signed certificate warning."
                  echo "Please verify DNS is propagated and try running the deployment again later."
                }
            else
              echo "Real SSL certificate already in place"
            fi

            echo "Running database migrations..."
            docker compose -f $COMPOSE_FILE exec -T php-fpm php bin/console doctrine:migrations:migrate --no-interaction || {
              echo "Migrations failed"
              exit 1
            }

            echo "Loading reference data (alignments, damage types, etc.)..."
            docker compose -f $COMPOSE_FILE exec -T php-fpm \
              php bin/console doctrine:fixtures:load --group=reference --append --no-interaction

            if [ "$RUN_IMPORTS" = "true" ]; then
              echo "Importing SRD data (spells, monsters, races, classes...) - may take several minutes..."
              docker compose -f $COMPOSE_FILE exec -T php-fpm \
                php -d memory_limit=2G bin/console app:import:all

              echo "Loading wiki categories..."
              docker compose -f $COMPOSE_FILE exec -T php-fpm \
                php bin/console doctrine:fixtures:load --group=wiki --append --no-interaction

              echo "SRD data import complete."
            else
              echo "Skipping SRD imports (tag does not end with -importWiki)."
            fi
            
            echo "Container status:"
            docker compose -f $COMPOSE_FILE ps
            
            echo "Recent logs from php-fpm:"
            docker compose -f $COMPOSE_FILE logs --tail=30 php-fpm
            
            echo "Final cleanup..."
            docker image prune -f
            
            echo "Deployment completed!"
          ENDSSH
      
      - name: Health Check
        id: health_check
        run: |
          echo "Waiting for application to fully start..."
          sleep 20
          
          echo "Running health checks..."
          MAX_RETRIES=10
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            # Test de l'API health endpoint (public) - using insecure flag for self-signed cert
            if curl -k -f -s -m 10 https://onlyroll.cloud/api/health > /dev/null 2>&1; then
              echo "API health endpoint is responding!"

              # Test du frontend
              if curl -k -f -s -m 10 https://onlyroll.cloud/ > /dev/null 2>&1; then
                echo "Frontend is responding!"
                echo "All health checks passed!"
                exit 0
              fi
            fi
            
            RETRY_COUNT=$((RETRY_COUNT+1))
            echo "Attempt $RETRY_COUNT/$MAX_RETRIES - Waiting 15s..."
            sleep 15
          done
          
          echo "Health checks didn't fully pass, checking deployment status..."
          
          ssh -i ~/.ssh/deploy_key ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << 'ENDSSH'
            cd /home/onlyroll/production
            echo "Container status:"
            docker compose -f docker-compose.prod.yml ps
            echo ""
            echo "Recent logs from php-fpm:"
            docker compose -f docker-compose.prod.yml logs --tail=50 php-fpm
            echo ""
            echo "Recent logs from nginx:"
            docker compose -f docker-compose.prod.yml logs --tail=30 nginx
          ENDSSH
          
          exit 1
      
      - name: Show deployment info
        if: always()
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "DEPLOYMENT INFORMATION"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "VPS Host: ${{ env.VPS_HOST }}"
          echo "Deploy Path: ${{ env.DEPLOY_PATH }}"
          echo "Application URL: https://onlyroll.cloud"
          echo "API URL: https://onlyroll.cloud/api"
          echo "Alternative: https://www.onlyroll.cloud"
          echo ""
          echo "To check logs on VPS:"
          echo "   ssh ${{ env.VPS_USER }}@${{ env.VPS_HOST }}"
          echo "   cd ${{ env.DEPLOY_PATH }}"
          echo "   docker compose -f docker-compose.prod.yml logs -f"
          echo ""
          echo "To check container status:"
          echo "   docker compose -f docker-compose.prod.yml ps"
          echo ""
      
      - name: Rollback on failure
        if: failure() && (steps.deploy.outcome == 'failure' || steps.health_check.outcome == 'failure')
        run: |
          echo "Deployment or health check failed! Starting image-based rollback..."

          ssh -i ~/.ssh/deploy_key ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << 'ENDSSH'
            DEPLOY_PATH="/home/onlyroll/production"
            COMPOSE_FILE="$DEPLOY_PATH/docker-compose.prod.yml"
            ROLLBACK_STATE_FILE="/home/onlyroll/.rollback-state"

            if [ ! -f "$ROLLBACK_STATE_FILE" ]; then
              echo "ERROR: No rollback state file found. This may be the first deployment."
              echo "Manual intervention required."
              exit 1
            fi

            echo "Loading rollback state..."
            . "$ROLLBACK_STATE_FILE"
            echo "  Tag:              ${ROLLBACK_TAG}"
            echo "  Migration:        ${ROLLBACK_MIGRATION_VERSION}"
            echo "  Saved at:         ${ROLLBACK_TIMESTAMP}"

            PHP_OK=$(docker image inspect "production-php-fpm:${ROLLBACK_TAG}" > /dev/null 2>&1 && echo "yes" || echo "no")
            FRONTEND_OK=$(docker image inspect "production-frontend:${ROLLBACK_TAG}" > /dev/null 2>&1 && echo "yes" || echo "no")

            if [ "$PHP_OK" = "no" ] || [ "$FRONTEND_OK" = "no" ]; then
              echo "WARNING: Rollback images not found (php-fpm: $PHP_OK, frontend: $FRONTEND_OK)."
              echo "Falling back to filesystem backup..."
              LATEST_BACKUP=$(ls -t /home/onlyroll/backups/ 2>/dev/null | head -n1)
              if [ -n "$LATEST_BACKUP" ] && [ -f "/home/onlyroll/backups/$LATEST_BACKUP/deployment.tar.gz" ]; then
                cd "$DEPLOY_PATH"
                find . -mindepth 1 -delete 2>/dev/null || true
                tar -xzf "/home/onlyroll/backups/$LATEST_BACKUP/deployment.tar.gz"
                docker compose -f docker-compose.prod.yml down --remove-orphans 2>/dev/null || true
                docker compose -f docker-compose.prod.yml up -d
                echo "Filesystem rollback completed from $LATEST_BACKUP"
              else
                echo "No filesystem backup available. Manual intervention required."
                exit 1
              fi
              exit 0
            fi

            echo "Stopping current containers..."
            cd "$DEPLOY_PATH"
            docker compose -f docker-compose.prod.yml down --remove-orphans 2>/dev/null || true

            echo "Retagging rollback images to latest..."
            docker tag "production-php-fpm:${ROLLBACK_TAG}" production-php-fpm:latest
            docker tag "production-frontend:${ROLLBACK_TAG}" production-frontend:latest

            echo "Starting services with previous images (no rebuild)..."
            docker compose -f docker-compose.prod.yml up -d --no-build

            echo "Waiting for containers to start (15s)..."
            sleep 15

            # Rollback des migrations seulement si elles ont changé pendant le déploiement
            CURRENT_VERSION=$(docker compose -f docker-compose.prod.yml exec -T php-fpm \
              php bin/console doctrine:migrations:current --no-interaction 2>/dev/null || echo "")

            if [ -n "$ROLLBACK_MIGRATION_VERSION" ] && \
               [ "$ROLLBACK_MIGRATION_VERSION" != "$CURRENT_VERSION" ]; then
              echo "Rolling back migrations: ${CURRENT_VERSION} → ${ROLLBACK_MIGRATION_VERSION}..."
              docker compose -f docker-compose.prod.yml exec -T php-fpm \
                php bin/console doctrine:migrations:migrate "${ROLLBACK_MIGRATION_VERSION}" \
                --no-interaction 2>&1 || echo "WARNING: Migration rollback returned an error. Check DB manually."
            else
              echo "No migration rollback needed (version unchanged or no prior version)."
            fi

            echo "Rollback container status:"
            docker compose -f docker-compose.prod.yml ps
            echo "Rollback completed."
          ENDSSH
      
      - name: Notify on success
        if: success()
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "DEPLOYMENT SUCCESSFUL!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Your application is now live at:"
          echo "   https://onlyroll.cloud"
          echo "   https://www.onlyroll.cloud"
          echo ""
      
      - name: Cleanup old rollback images on success
        if: success()
        run: |
          ssh -i ~/.ssh/deploy_key ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << 'ENDSSH'
            echo "Cleaning up old rollback images (keeping 2 most recent per service)..."
            for SERVICE in production-php-fpm production-frontend; do
              IMAGES_TO_DELETE=$(
                docker images --format '{{.CreatedAt}}\t{{.Repository}}:{{.Tag}}' \
                  | grep "${SERVICE}:rollback-" \
                  | sort -r \
                  | awk 'NR>2 {print $2}'
              )
              if [ -n "$IMAGES_TO_DELETE" ]; then
                echo "$IMAGES_TO_DELETE" | xargs docker rmi 2>/dev/null || true
              fi
            done
            echo "Cleanup complete (kept latest 2 rollback images per service)."
          ENDSSH

      - name: Notify on failure
        if: failure()
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "DEPLOYMENT FAILED"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Check the logs above for details"
          echo "Connect to server:"
          echo "   ssh ${{ env.VPS_USER }}@${{ env.VPS_HOST }}"
          echo ""