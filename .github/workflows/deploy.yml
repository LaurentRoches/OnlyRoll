name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VPS_HOST: 72.61.195.28
  VPS_USER: root
  DEPLOY_PATH: /home/onlyroll/production

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.VPS_HOST }} >> ~/.ssh/known_hosts
      
      - name: Create deployment package
        run: |
          # Liste les fichiers avant de créer le package
          echo "📋 Files to be packaged:"
          ls -la
          
          # Créer le package - on ignore les erreurs de fichiers manquants avec "|| true"
          echo "📦 Creating deployment package..."
          tar -czf deployment.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='var' \
            --exclude='dist' \
            --exclude='.github' \
            --exclude='*.tar.gz' \
            --exclude='.env.local' \
            --exclude='.DS_Store' \
            . 2>/dev/null || true
          
          # Vérifier que le package a bien été créé
          if [ ! -f deployment.tar.gz ]; then
            echo "❌ Failed to create deployment package!"
            exit 1
          fi
          
          # Afficher la taille du package
          ls -lh deployment.tar.gz
          echo "✅ Deployment package created successfully"
      
      - name: Backup current deployment
        run: |
          ssh -i ~/.ssh/deploy_key ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << 'ENDSSH'
            set -e
            
            # Variables locales
            DEPLOY_PATH="/home/onlyroll/production"
            BACKUP_DIR="/home/onlyroll/backups/$(date +%Y%m%d_%H%M%S)"
            
            # Vérifier si le répertoire de déploiement existe
            if [ -d "$DEPLOY_PATH" ] && [ "$(ls -A $DEPLOY_PATH 2>/dev/null)" ]; then
              mkdir -p "$BACKUP_DIR"
              
              echo "📦 Creating backup at $BACKUP_DIR..."
              cd "$DEPLOY_PATH"
              
              tar -czf "$BACKUP_DIR/deployment.tar.gz" . 2>/dev/null || {
                echo "⚠️ Backup failed (non-critical for first deployment)"
              }
              
              echo "✅ Backup completed"
            else
              echo "ℹ️ No existing deployment found - first deployment"
              mkdir -p "$DEPLOY_PATH"
            fi
          ENDSSH
      
      - name: Upload to VPS
        run: |
          echo "📤 Uploading deployment package to VPS..."
          scp -i ~/.ssh/deploy_key deployment.tar.gz ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:/home/onlyroll/production/
          echo "✅ Upload completed"
      
      - name: Deploy on VPS
        id: deploy
        run: |
          ssh -i ~/.ssh/deploy_key ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << 'ENDSSH'
            set -e
            
            # Variables locales
            DEPLOY_PATH="/home/onlyroll/production"
            
            cd "$DEPLOY_PATH"
            
            echo "📦 Extracting deployment package..."
            tar -xzf deployment.tar.gz
            rm deployment.tar.gz
            
            echo "📝 Files extracted:"
            ls -la
            
            # Vérifier si docker-compose existe
            if [ ! -f "docker-compose.yml" ]; then
              echo "❌ docker-compose.yml not found!"
              echo "Available files:"
              ls -la
              exit 1
            fi
            
            echo "✅ docker-compose.yml found"
            
            # Vérifier si docker-compose.prod.yml existe
            if [ ! -f "docker-compose.prod.yml" ]; then
              echo "⚠️ docker-compose.prod.yml not found, using docker-compose.yml only"
              COMPOSE_FILES="-f docker-compose.yml"
            else
              echo "✅ docker-compose.prod.yml found"
              COMPOSE_FILES="-f docker-compose.yml -f docker-compose.prod.yml"
            fi
            
            # Vérifier si .env existe
            if [ ! -f ".env" ] && [ ! -f "backend/.env" ]; then
              echo "⚠️ No .env file found - using default configuration"
            fi
            
            echo "🔨 Building Docker images..."
            docker compose $COMPOSE_FILES build
            
            echo "🗄️ Running database migrations..."
            docker compose $COMPOSE_FILES run --rm backend php bin/console doctrine:migrations:migrate --no-interaction || {
              echo "⚠️ Migrations failed or not needed"
            }
            
            echo "🚀 Starting services..."
            docker compose $COMPOSE_FILES up -d --remove-orphans
            
            echo "🧹 Cleaning up old images..."
            docker image prune -f
            
            echo "✅ Deployment completed successfully!"
          ENDSSH
      
      - name: Health Check
        run: |
          echo "⏳ Waiting for services to start..."
          sleep 30
          
          echo "🏥 Checking application health..."
          MAX_RETRIES=6
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            # Essayer plusieurs endpoints
            if curl -f -s http://${{ env.VPS_HOST }}/ > /dev/null 2>&1; then
              echo "✅ Application is responding!"
              exit 0
            elif curl -f -s http://${{ env.VPS_HOST }}/health > /dev/null 2>&1; then
              echo "✅ Health endpoint is responding!"
              exit 0
            elif curl -f -s http://${{ env.VPS_HOST }}/api > /dev/null 2>&1; then
              echo "✅ API is responding!"
              exit 0
            else
              RETRY_COUNT=$((RETRY_COUNT+1))
              echo "⏳ Attempt $RETRY_COUNT/$MAX_RETRIES - Waiting 10s..."
              sleep 10
            fi
          done
          
          echo "⚠️ Health check didn't pass, but deployment may still be successful"
          echo "Please verify manually at: http://${{ env.VPS_HOST }}"
          # Ne pas faire échouer le déploiement pour le health check
          exit 0
      
      - name: Show deployment info
        if: always()
        run: |
          echo "📊 Deployment Information:"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🌐 VPS Host: ${{ env.VPS_HOST }}"
          echo "📁 Deploy Path: ${{ env.DEPLOY_PATH }}"
          echo "🔗 Application URL: http://${{ env.VPS_HOST }}"
          echo ""
          echo "🔧 To check logs on VPS:"
          echo "   ssh ${{ env.VPS_USER }}@${{ env.VPS_HOST }}"
          echo "   cd ${{ env.DEPLOY_PATH }}"
          echo "   docker compose logs -f"
      
      - name: Rollback on failure
        if: failure() && steps.deploy.outcome == 'failure'
        run: |
          echo "❌ Deployment failed! Starting rollback..."
          
          ssh -i ~/.ssh/deploy_key ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << 'ENDSSH'
            DEPLOY_PATH="/home/onlyroll/production"
            cd "$DEPLOY_PATH"
            
            # Trouver le dernier backup
            LATEST_BACKUP=$(ls -t /home/onlyroll/backups/ 2>/dev/null | head -n1)
            
            if [ -n "$LATEST_BACKUP" ] && [ -f "/home/onlyroll/backups/$LATEST_BACKUP/deployment.tar.gz" ]; then
              echo "📦 Restoring from backup: $LATEST_BACKUP"
              
              # Nettoyer le déploiement raté
              find . -mindepth 1 -delete 2>/dev/null || true
              
              # Restaurer le backup
              tar -xzf /home/onlyroll/backups/$LATEST_BACKUP/deployment.tar.gz
              
              echo "🚀 Restarting services..."
              docker compose -f docker-compose.yml up -d --remove-orphans || {
                docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
              }
              
              echo "✅ Rollback completed"
            else
              echo "⚠️ No backup found - this might be the first deployment"
              echo "Manual intervention may be required"
            fi
          ENDSSH
      
      - name: Notify on success
        if: success()
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎉 DEPLOYMENT SUCCESSFUL!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "🌐 Your application is now live at:"
          echo "   http://${{ env.VPS_HOST }}"
          echo ""
          echo "📊 To monitor your application:"
          echo "   docker compose -f docker-compose.yml logs -f"
          echo ""
      
      - name: Notify on failure
        if: failure()
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "❌ DEPLOYMENT FAILED"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "🔍 Check the logs above for details"
          echo "🔧 Connect to server to investigate:"
          echo "   ssh ${{ env.VPS_USER }}@${{ env.VPS_HOST }}"
          echo "   cd ${{ env.DEPLOY_PATH }}"
          echo ""