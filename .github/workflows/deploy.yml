name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VPS_HOST: 72.61.195.28
  VPS_USER: root
  DEPLOY_PATH: /home/onlyroll/production

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.VPS_HOST }} >> ~/.ssh/known_hosts
      
      - name: Create deployment package
        run: |
          tar -czf deployment.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='var/cache' \
            --exclude='var/log' \
            .
      
      - name: Backup current deployment
        run: |
          ssh -i ~/.ssh/deploy_key ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << 'ENDSSH'
            cd ${{ env.DEPLOY_PATH }}
            
            BACKUP_DIR="/home/onlyroll/backups/$(date +%Y%m%d_%H%M%S)"
            mkdir -p $BACKUP_DIR
            
            echo "Creating backup at $BACKUP_DIR..."
            tar -czf $BACKUP_DIR/deployment.tar.gz \
              --exclude='var/cache' \
              --exclude='var/log' \
              --exclude='node_modules' \
              --exclude='vendor' \
              . || echo "Backup failed (non-critical)"
            
            echo "Backup completed"
          ENDSSH
      
      - name: Upload to VPS
        run: |
          scp -i ~/.ssh/deploy_key deployment.tar.gz ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:${{ env.DEPLOY_PATH }}/
      
      - name: Deploy on VPS
        id: deploy
        run: |
          ssh -i ~/.ssh/deploy_key ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << 'ENDSSH'
            set -e
            cd ${{ env.DEPLOY_PATH }}
            
            echo "Extracting deployment package..."
            tar -xzf deployment.tar.gz
            rm deployment.tar.gz
            
            echo "Building Docker images..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build
            
            echo "Running database migrations..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm backend php bin/console doctrine:migrations:migrate --no-interaction || echo "Migrations completed or skipped"
            
            echo "Restarting services with zero-downtime..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --force-recreate
            
            echo "Cleaning up..."
            docker image prune -f
            
            echo "Deployment completed successfully!"
          ENDSSH
      
      - name: Health Check
        run: |
          echo "Waiting for services to start..."
          sleep 20
          
          echo "Checking API health..."
          if curl -f http://${{ env.VPS_HOST }}/api/health; then
            echo "Health check PASSED!"
          else
            echo "Health check FAILED!"
            exit 1
          fi
      
      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed! Starting rollback..."
          
          ssh -i ~/.ssh/deploy_key ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << 'ENDSSH'
            cd ${{ env.DEPLOY_PATH }}
            
            LATEST_BACKUP=$(ls -t /home/onlyroll/backups/ | head -n1)
            
            if [ -n "$LATEST_BACKUP" ]; then
              echo "Restoring from backup: $LATEST_BACKUP"
              tar -xzf /home/onlyroll/backups/$LATEST_BACKUP/deployment.tar.gz
              
              echo "Restarting services..."
              docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --force-recreate
              
              echo "Rollback completed"
            else
              echo "No backup found - manual intervention required"
            fi
          ENDSSH
      
      - name: Notify on success
        if: success()
        run: |
          echo "Deployment successful!"
          echo "Application is now live at http://${{ env.VPS_HOST }}"