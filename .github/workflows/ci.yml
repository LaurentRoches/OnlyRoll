name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  PHP_VERSION: '8.3'
  NODE_VERSION: '22'
  COMPOSER_VERSION: '2'

jobs:
  # ============================================
  # JOB 0: VALIDATION DOCKER
  # ============================================
  docker-validation:
    name: Validate Docker Setup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env.docker for CI
        run: |
          cp .env.docker.example .env.docker
          echo "MYSQL_ROOT_PASSWORD=root" >> .env.docker
          echo "MYSQL_DATABASE=onlyroll_test" >> .env.docker
          echo "MYSQL_USER=onlyroll_db" >> .env.docker
          echo "MYSQL_PASSWORD=onlyroll_docker_pass" >> .env.docker

      - name: Build Docker images
        run: docker compose build

      - name: Start Docker services
        run: docker compose up -d

      - name: Wait for services to be healthy
        run: |
          echo "⏳ Waiting for services to be healthy..."
          timeout 120 bash -c 'until docker compose ps | grep -q "healthy"; do sleep 2; done' || (docker compose logs && exit 1)

      - name: Check API health
        run: |
          curl -f http://localhost/health || exit 1

      - name: Check Frontend build
        run: |
          docker compose logs frontend | grep -q "ready in" || exit 1

      - name: Check Mercure
        run: |
          curl -s http://localhost:3000/.well-known/mercure > /dev/null && echo "Mercure is running" || echo "Mercure check returned a response (may be expected)"

      - name: Stop containers
        if: always()
        run: docker compose down -v

  # ============================================
  # JOB 1: TESTS BACKEND (PHP/Symfony)
  # ============================================
  backend-tests:
    name: Backend Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        php: ['8.3']
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: onlyroll_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, gd, json, redis
          coverage: xdebug
          tools: composer:v2
      
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      
      - name: Install Composer dependencies
        working-directory: ./backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
      
      - name: Copy .env.test
        working-directory: ./backend
        run: |
          cp .env.test.dist .env.test
          echo "DATABASE_URL=mysql://root:root@127.0.0.1:3306/onlyroll_test?serverVersion=8.0" >> .env.test
          echo "REDIS_URL=redis://127.0.0.1:6379" >> .env.test
      
      - name: Generate JWT keys for testing
        working-directory: ./backend
        run: |
          mkdir -p config/jwt
          openssl genrsa -out config/jwt/private.pem -aes256 -passout pass:testpassphrase 4096
          openssl rsa -pubout -in config/jwt/private.pem -out config/jwt/public.pem -passin pass:testpassphrase
          echo "JWT_SECRET_KEY=%kernel.project_dir%/config/jwt/private.pem" >> .env.test
          echo "JWT_PUBLIC_KEY=%kernel.project_dir%/config/jwt/public.pem" >> .env.test
          echo "JWT_PASSPHRASE=testpassphrase" >> .env.test
      
      - name: Create database schema
        working-directory: ./backend
        run: |
          php bin/console doctrine:database:create --env=test --if-not-exists
          php bin/console doctrine:migrations:migrate --env=test --no-interaction
      
      - name: Run PHPUnit tests with coverage
        working-directory: ./backend
        run: |
          vendor/bin/phpunit --coverage-text --coverage-clover=coverage.xml --coverage-html=coverage/html --log-junit=test-results.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.php == '8.3'
        with:
          files: ./backend/coverage.xml
          flags: backend
          name: backend-coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report-php-${{ matrix.php }}
          path: ./backend/coverage/html

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results-php-${{ matrix.php }}
          path: ./backend/test-results.xml

  # ============================================
  # JOB 2: CODE QUALITY BACKEND
  # ============================================
  backend-quality:
    name: Backend Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql
          tools: composer:v2
      
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      
      - name: Install Composer dependencies
        working-directory: ./backend
        run: composer install --no-interaction --prefer-dist
      
      - name: Run PHPStan
        working-directory: ./backend
        run: vendor/bin/phpstan analyse src --level=5 || true
      
      - name: Run PHP-CS-Fixer (dry-run)
        working-directory: ./backend
        run: vendor/bin/php-cs-fixer fix --dry-run --diff || true

  # ============================================
  # JOB 3: TESTS FRONTEND (Vue.js)
  # ============================================
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps

      - name: Run unit tests with coverage
        working-directory: ./frontend
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage-report
          path: ./frontend/coverage

      - name: Build for production
        working-directory: ./frontend
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ./frontend/dist

  # ============================================
  # JOB 4: CODE QUALITY FRONTEND
  # ============================================
  frontend-quality:
    name: Frontend Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint
      
      - name: Check Prettier formatting
        working-directory: ./frontend
        run: npm run format:check
      
      - name: TypeScript type checking
        working-directory: ./frontend
        run: npm run type-check
      
      - name: Build check
        working-directory: ./frontend
        run: npm run build

  # ============================================
  # JOB 5: E2E TESTS (Playwright)
  # ============================================
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Chromium
        working-directory: ./frontend
        run: npx playwright install chromium --with-deps

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env.docker for CI
        run: |
          cp .env.docker.example .env.docker
          echo "MYSQL_ROOT_PASSWORD=root" >> .env.docker
          echo "MYSQL_DATABASE=onlyroll_test" >> .env.docker
          echo "MYSQL_USER=onlyroll_db" >> .env.docker
          echo "MYSQL_PASSWORD=onlyroll_docker_pass" >> .env.docker

      - name: Build Docker images
        run: docker compose build

      - name: Start Docker services
        run: docker compose up -d

      - name: Wait for API health check
        run: |
          timeout 180 bash -c \
            'until curl -sf http://localhost/api/health > /dev/null 2>&1; do sleep 3; done' \
            || (docker compose logs && exit 1)

      - name: Wait for frontend to be accessible
        run: |
          timeout 60 bash -c \
            'until curl -sf http://localhost:5173/ > /dev/null 2>&1; do sleep 2; done' \
            || (docker compose logs frontend && exit 1)

      - name: Run E2E tests
        working-directory: ./frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          CI: true
        run: npx playwright test e2e/auth.e2e.spec.ts e2e/game.e2e.spec.ts

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-e2e-report
          path: ./frontend/playwright-report/
          retention-days: 30

      - name: Stop containers
        if: always()
        run: docker compose down -v

  # ============================================
  # JOB 6: SECURITY CHECKS
  # ============================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Backend security check (Symfony)
        uses: symfonycorp/security-checker-action@v5
        with:
          lock: ./backend/composer.lock
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Frontend security audit
        working-directory: ./frontend
        run: npm audit --audit-level=moderate --omit=dev

    # ============================================
  # JOB 6: ACCESSIBILITY AUDIT (RGAA/WCAG)
  # ============================================
  accessibility:
    name: Accessibility Audit (RGAA/WCAG)
    runs-on: ubuntu-latest
    needs: [frontend-tests, frontend-quality]
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps
      
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
      
      # Test 1: Lighthouse CI (Performance + Accessibility + Best Practices)
      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.13.x
      
      - name: Run Lighthouse CI
        working-directory: ./frontend
        run: |
          lhci autorun --collect.staticDistDir=./dist || echo "Lighthouse scores below threshold"
        continue-on-error: true
      
      # Test 2: axe-core via pa11y (Tests d'accessibilité détaillés)
      - name: Install pa11y-ci
        run: npm install -g pa11y-ci serve
      
      - name: Create pa11y config
        working-directory: ./frontend
        run: |
          cat > .pa11yci.json << 'EOF'
          {
            "defaults": {
              "standard": "WCAG2AA",
              "runners": ["axe"],
              "timeout": 30000,
              "wait": 1000,
              "chromeLaunchConfig": {
                "args": ["--no-sandbox", "--disable-setuid-sandbox"]
              }
            },
            "urls": [
              "http://localhost:8080/",
              "http://localhost:8080/auth/login",
              "http://localhost:8080/auth/register"
            ]
          }
          EOF
      
      - name: Start static server
        working-directory: ./frontend
        run: |
          npx serve -s dist -l 8080 &
          echo $! > server.pid
          sleep 5
      
      - name: Run pa11y accessibility tests
        working-directory: ./frontend
        run: pa11y-ci --json > pa11y-report.json || echo "⚠️ Accessibility issues detected"
        continue-on-error: true
      
      - name: Stop server
        if: always()
        working-directory: ./frontend
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
          fi
      
      # Génération du rapport d'accessibilité
      - name: Generate accessibility summary
        if: always()
        working-directory: ./frontend
        run: |
          echo "# Rapport d'Accessibilité" > accessibility-report.md
          echo "" >> accessibility-report.md
          echo "**Date**: $(date '+%Y-%m-%d %H:%M:%S')" >> accessibility-report.md
          echo "**Normes**: WCAG 2.1 AA, RGAA 4.1" >> accessibility-report.md
          echo "" >> accessibility-report.md
          
          if [ -f .lighthouseci/manifest.json ]; then
            echo "## Lighthouse Scores" >> accessibility-report.md
            echo "Lighthouse audit exécuté - voir artifacts" >> accessibility-report.md
            echo "" >> accessibility-report.md
          fi
          
          if [ -f pa11y-report.json ]; then
            echo "## Tests pa11y (axe-core)" >> accessibility-report.md
            ERRORS=$(cat pa11y-report.json | grep -o '"type":"error"' | wc -l || echo "0")
            WARNINGS=$(cat pa11y-report.json | grep -o '"type":"warning"' | wc -l || echo "0")
            echo "- **Erreurs critiques**: $ERRORS" >> accessibility-report.md
            echo "- **Avertissements**: $WARNINGS" >> accessibility-report.md
            echo "" >> accessibility-report.md
          fi
          
          echo "## Critères testés" >> accessibility-report.md
          echo "- Contrastes de couleurs (WCAG 1.4.3)" >> accessibility-report.md
          echo "- Navigation au clavier (WCAG 2.1.1)" >> accessibility-report.md
          echo "- Attributs ARIA (WCAG 4.1.2)" >> accessibility-report.md
          echo "- Structure sémantique HTML (WCAG 1.3.1)" >> accessibility-report.md
          echo "- Textes alternatifs images (WCAG 1.1.1)" >> accessibility-report.md
          echo "- Labels de formulaires (WCAG 3.3.2)" >> accessibility-report.md
          echo "" >> accessibility-report.md
          
          echo "## Conformité légale" >> accessibility-report.md
          echo "- European Accessibility Act (juin 2025)" >> accessibility-report.md
          echo "- RGAA 4.1 (Référentiel Général d'Amélioration de l'Accessibilité)" >> accessibility-report.md
          echo "- WCAG 2.1 niveau AA" >> accessibility-report.md
          
          cat accessibility-report.md
      
      # Upload des résultats
      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-accessibility-report
          path: |
            ./frontend/.lighthouseci/
            ./frontend/accessibility-report.md
          retention-days: 30
      
      - name: Upload pa11y results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pa11y-accessibility-report
          path: |
            ./frontend/pa11y-report.json
            ./frontend/accessibility-report.md
          retention-days: 30
      
      # Commentaire sur la PR avec les résultats (optionnel)
      - name: Comment PR with accessibility results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('./frontend/accessibility-report.md')) {
              const report = fs.readFileSync('./frontend/accessibility-report.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: report
              });
            }

  # ============================================
  # JOB 7: BUILD DOCKER IMAGES
  # ============================================
  docker-build:
    name: Build & Validate Docker Images
    runs-on: ubuntu-latest
    needs: [docker-validation, backend-tests, backend-quality, frontend-tests, frontend-quality, security, accessibility, e2e-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      # Build Backend (Production) - AVEC load: true
      - name: Build backend production image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: php_prod
          push: false
          load: true
          tags: onlyroll-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_ENV=prod
            APP_DEBUG=0

      # Build Frontend (Production) - AVEC load: true
      - name: Build frontend production image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          target: nginx_prod
          push: false
          load: true
          tags: onlyroll-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=https://onlyroll.cloud/api
            VITE_WS_URL=wss://onlyroll.cloud:3000
            VITE_MERCURE_URL=https://onlyroll.cloud/.well-known/mercure

      # Test des images buildées
      - name: Test backend image
        run: |
          docker images
          docker run --rm --entrypoint php onlyroll-backend:latest -v
          docker run --rm --entrypoint php onlyroll-backend:latest bin/console --version || echo "Console not available in prod mode"

      - name: Test frontend image
        run: |
          docker run -d --name frontend-test -p 8080:80 onlyroll-frontend:latest
          sleep 5
          curl -f http://localhost:8080/ || exit 1
          docker stop frontend-test

      - name: Show image sizes
        run: |
          echo "Docker Image Sizes:"
          docker images | grep onlyroll

  # ============================================
  # JOB 8: NOTIFICATION FINALE
  # ============================================
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [docker-validation, backend-tests, frontend-tests, backend-quality, frontend-quality, accessibility, e2e-tests]
    if: always()

    steps:
      - name: Check job statuses
        run: |
          echo "Docker Validation: ${{ needs.docker-validation.result }}"
          echo "Backend Tests: ${{ needs.backend-tests.result }}"
          echo "Frontend Tests: ${{ needs.frontend-tests.result }}"
          echo "Backend Quality: ${{ needs.backend-quality.result }}"
          echo "Frontend Quality: ${{ needs.frontend-quality.result }}"
          echo "Accessibility: ${{ needs.accessibility.result }}"
          echo "E2E Tests: ${{ needs.e2e-tests.result }}"

  # ============================================
  # JOB 9: GITHUB RELEASE
  # ============================================
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - backend-quality
      - frontend-tests
      - frontend-quality
      - security
      - e2e-tests
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} \
            --generate-notes \
            --title "Release ${{ github.ref_name }}"