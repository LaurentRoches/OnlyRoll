version: '3.9'

services:
  # ===========================================
  # MYSQL - PRODUCTION
  # ===========================================
  mysql:
    image: mysql:8.0
    container_name: onlyroll-mysql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --max_connections=200
      - --innodb_buffer_pool_size=512M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - onlyroll-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ===========================================
  # REDIS - PRODUCTION
  # ===========================================
  redis:
    image: redis:7.2-alpine
    container_name: onlyroll-redis
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - onlyroll-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ===========================================
  # BACKEND PHP-FPM - PRODUCTION
  # ===========================================
  php-fpm:
    build:
      context: ./backend
      target: php_prod
      args:
        APP_ENV: prod
        APP_DEBUG: 0
    container_name: onlyroll-php
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      MERCURE_URL: http://mercure:3000/.well-known/mercure
      MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL}
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN}
    volumes:
      - ./backend:/var/www/html:cached
      - backend-var:/var/www/html/var
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - onlyroll-network
    restart: unless-stopped

  # ===========================================
  # NGINX - PRODUCTION (Reverse Proxy)
  # ===========================================
  nginx:
    image: nginx:1.25-alpine
    container_name: onlyroll-nginx
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./backend/public:/var/www/html/public:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - php-fpm
    networks:
      - onlyroll-network
    restart: unless-stopped

  # ===========================================
  # MERCURE - PRODUCTION (WebSocket Hub)
  # ===========================================
  mercure:
    image: dunglas/mercure:v0.15
    container_name: onlyroll-mercure
    environment:
      SERVER_NAME: ':3000'
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET}
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins ${CORS_ALLOW_ORIGIN}
        log_level info
    ports:
      - "3000:3000"
    volumes:
      - mercure-data:/data
    networks:
      - onlyroll-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "-O", "/dev/null", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  backend-var:
    driver: local
  mercure-data:
    driver: local

networks:
  onlyroll-network:
    driver: bridge
    name: onlyroll-network-prod