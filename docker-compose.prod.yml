services:
  # ===========================================
  # MYSQL - PRODUCTION
  # ===========================================
  mysql:
    image: mysql:8.0
    container_name: onlyroll-mysql-prod
    command:
      - --default-authentication-plugin=mysql_native_password
      - --max_connections=200
      - --innodb_buffer_pool_size=512M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - onlyroll-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 120s

  # ===========================================
  # REDIS - PRODUCTION
  # ===========================================
  redis:
    image: redis:7.2-alpine
    container_name: onlyroll-redis-prod
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - onlyroll-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ===========================================
  # BACKEND PHP-FPM - PRODUCTION
  # ===========================================
  php-fpm:
    build:
      context: ./backend
      target: php_prod
      args:
        APP_ENV: prod
        APP_DEBUG: 0
    container_name: onlyroll-php-prod
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      APP_SECRET: ${APP_SECRET}
      DEFAULT_URI: ${DEFAULT_URI}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      MERCURE_URL: http://mercure:3000/.well-known/mercure
      MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL}
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN}
    volumes:
      - backend-var:/var/www/html/var
      - backend-uploads:/var/www/html/public/uploads
      - ./backend/.env:/var/www/html/.env:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - onlyroll-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===========================================
  # FRONTEND - PRODUCTION (Vue.js + Nginx)
  # ===========================================
  frontend:
    build:
      context: ./frontend
      target: nginx_prod
      args:
        VITE_API_URL: ${VITE_API_URL:-http://72.61.195.28/api}
        VITE_WS_URL: ${VITE_WS_URL:-ws://72.61.195.28:3000}
    container_name: onlyroll-frontend-prod
    networks:
      - onlyroll-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===========================================
  # NGINX - PRODUCTION (Reverse Proxy)
  # ===========================================
  nginx:
    image: nginx:1.25-alpine
    container_name: onlyroll-nginx-prod
    volumes:
      - ./docker/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - backend-uploads:/var/www/html/public/uploads:ro
      - certbot-webroot:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - php-fpm
      - frontend
    networks:
      - onlyroll-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ===========================================
  # CERTBOT - SSL Certificate Management
  # ===========================================
  certbot:
    image: certbot/certbot:latest
    container_name: onlyroll-certbot-prod
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - onlyroll-network

  # ===========================================
  # MERCURE - PRODUCTION (WebSocket Hub)
  # ===========================================
  mercure:
    image: dunglas/mercure:v0.15
    container_name: onlyroll-mercure-prod
    environment:
      SERVER_NAME: ':3000'
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET}
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins ${CORS_ALLOW_ORIGIN:-http://72.61.195.28}
        log_level info
    ports:
      - "3000:3000"
    volumes:
      - mercure-data:/data
    networks:
      - onlyroll-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "-O", "/dev/null", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  backend-var:
    driver: local
  backend-uploads:
    driver: local
  mercure-data:
    driver: local
  certbot-webroot:
    driver: local
  certbot-certs:
    driver: local

networks:
  onlyroll-network:
    name: onlyroll-network-prod