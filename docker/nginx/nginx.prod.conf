user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    upstream php_backend {
        server php-fpm:9000;
    }

    upstream frontend_backend {
        server frontend:80;
    }

    upstream mercure_backend {
        server mercure:3000;
    }

    # Localhost HTTP Server - For Docker health checks
    server {
        listen 80 default_server;
        server_name localhost;
        root /var/www/html/public;

        # Health Check (for Docker)
        location /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # Redirect everything else to the domain
        location / {
            return 301 https://onlyroll.cloud$request_uri;
        }
    }

    # HTTP Server - Redirect to HTTPS (except for ACME challenge)
    server {
        listen 80;
        server_name onlyroll.cloud www.onlyroll.cloud;

        # Certbot challenge for SSL certificate validation
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Health Check (also available here)
        location /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # HTTPS Server
    server {
        listen 443 ssl http2;
        server_name onlyroll.cloud www.onlyroll.cloud;
        root /var/www/html/public;

        # SSL Configuration
        ssl_certificate /etc/letsencrypt/live/onlyroll.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/onlyroll.cloud/privkey.pem;

        # SSL Security Settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Augmenter la limite de taille des uploads (pour les images de carte)
        client_max_body_size 100M;

        # API Routes - Proxy vers PHP-FPM
        location /api {
            try_files $uri /index.php$is_args$args;
        }

        # PHP-FPM
        location ~ \.php$ {
            fastcgi_pass php_backend;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_buffer_size 128k;
            fastcgi_buffers 4 256k;

            # Timeouts pour les uploads de gros fichiers
            fastcgi_read_timeout 300;
            fastcgi_send_timeout 300;

            # Forward CORS headers to PHP
            fastcgi_param HTTP_ORIGIN $http_origin;
            fastcgi_param HTTP_ACCESS_CONTROL_REQUEST_METHOD $http_access_control_request_method;
            fastcgi_param HTTP_ACCESS_CONTROL_REQUEST_HEADERS $http_access_control_request_headers;

            # Forward HTTPS info to PHP
            fastcgi_param HTTPS on;
        }

        # Mercure Hub - Proxy for Server-Sent Events (SSE)
        location /.well-known/mercure {
            proxy_pass http://mercure_backend;
            proxy_http_version 1.1;

            # Headers for SSE
            proxy_set_header Connection '';
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
            proxy_set_header Cookie $http_cookie;

            # Disable buffering for SSE
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 24h;
            proxy_connect_timeout 5s;

            # Allow chunked transfer encoding
            chunked_transfer_encoding on;

            # CORS headers
            add_header 'Access-Control-Allow-Origin' 'https://onlyroll.cloud' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Last-Event-ID' always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # Health Check
        location /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # Uploads - Servir les fichiers uploadés
        location /uploads {
            try_files $uri $uri/ =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Frontend - Proxy vers le conteneur frontend pour toutes les autres requêtes
        location / {
            proxy_pass http://frontend_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Bloquer l'accès aux fichiers cachés sauf /.well-known/
        location ~ /\.(?!well-known/) {
            deny all;
        }
    }
}
