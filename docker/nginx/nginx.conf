user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    upstream php_backend {
        server php-fpm:9000;
    }

    upstream frontend_backend {
        server frontend:80;
    }

    server {
        listen 80;
        server_name localhost;
        root /var/www/html/public;

        # Augmenter la limite de taille des uploads (pour les images de carte)
        client_max_body_size 100M;

        # API Routes - Proxy vers PHP-FPM
        location /api {
            try_files $uri /index.php$is_args$args;
        }

        # PHP-FPM
        location ~ \.php$ {
            fastcgi_pass php_backend;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_buffer_size 128k;
            fastcgi_buffers 4 256k;

            # Timeouts pour les uploads de gros fichiers
            fastcgi_read_timeout 300;
            fastcgi_send_timeout 300;

            # Forward CORS headers to PHP
            fastcgi_param HTTP_ORIGIN $http_origin;
            fastcgi_param HTTP_ACCESS_CONTROL_REQUEST_METHOD $http_access_control_request_method;
            fastcgi_param HTTP_ACCESS_CONTROL_REQUEST_HEADERS $http_access_control_request_headers;
        }

        # Health Check
        location /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # Uploads - Servir depuis le backend
        location /uploads {
            alias /var/www/html/public/uploads;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Frontend - Proxy vers le conteneur frontend pour toutes les autres requêtes
        location / {
            proxy_pass http://frontend_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        location ~ /\. {
            deny all;
        }
    }
}
