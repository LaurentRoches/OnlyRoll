nelmio_api_doc:
    documentation:
        info:
            title: OnlyRoll API
            description: API REST pour OnlyRoll — plateforme de jeu de rôle en ligne (D&D 5e)
            version: 1.0.0
        components:
            securitySchemes:
                BearerAuth:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
        security:
            - BearerAuth: []
    html_config:
        assets_mode: bundle
    areas:
        path_patterns:
            - ^/api(?!/doc$)
